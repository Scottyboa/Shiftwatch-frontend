# SHIFTWATCH KALENDER – STANDARDKONFIG FOR NETTSIDEN
#
# Denne filen lastes automatisk når nettsiden åpnes fra en statisk webserver.
# Du kan redigere criteria-blokken direkte i GitHub-repoet. Appen leser hele
# filen, men bruker bare kalenderfeltene i criteria til kalenderen.
#
# Ikke legg passord, tokens eller andre hemmeligheter i et offentlig repo.

mail:
  provider: "graph"
  username: ""
  sender: "ikkesvar@legevakt.no"
  mailbox: "inbox"
  poll_seconds: 1.5
  top: 25
  mark_seen: false

graph:
  client_id: ""
  tenant: "consumers"
  scopes:
    - "Mail.Read"
    - "Files.ReadWrite.AppFolder"
  token_cache: ".tokens/msal_cache.bin"

calendar_sync:
  enabled: true
  poll_seconds: 3
  file_name: "shiftwatch_calendar_config.json"

remote_control:
  enabled: true
  poll_seconds: 2
  command_ttl_seconds: 60
  file_name: "shiftwatch_agent_control.json"

criteria:
  # Lokale kriterier som vises i full config, men ikke sendes av Copy-knappen.
  allowed_locations:
    - "Moss"
  blocked_kinds_contains:
    - "natt"
    - "bil"
    - "bakvakt"
  allowed_time_rules:
    - start: "16:00"
      end: "22:00"
      exact: true
    - start: "12:00"
      end: "20:00"
      exact: true
  disallow_night: true

  # Kalenderfeltene som appen leser, fargelegger og redigerer.
  allowed_date_ranges:
    - start: "2026-08-11"
      end: "2026-09-27"
      weekdays:
        - "monday"
        - "tuesday"
        - "wednesday"
        - "thursday"
        - "saturday"
    - start: "2026-09-28"
      end: "2026-12-20"
      weekdays:
        - "monday"
        - "tuesday"
        - "wednesday"
        - "thursday"
        - "saturday"

  # Legacy-feltene holdes synkronisert av appen ved eksport.
  date_start: "2026-08-11"
  date_end: "2026-12-20"
  blocked_weekdays:
    - "friday"
    - "sunday"

  extra_include_dates:
    - "2026-09-18"
    - "2026-10-16"

  exclude_dates:
    - "2026-08-15"
    - "2026-09-12"
    - "2026-10-10"

action:
  mode: "dry_run"

state:
  path: ".state/processed_messages.json"

